<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wishing Well</title>
    <meta
      name="description"
      content="Write a wish, toss it into a magical well, and discover wishes from around the world."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/well.css" />
  </head>
  <body>
    <main class="app" aria-label="Wishing Well interactive experience">

      <!-- ============================================ -->
      <!-- 1. SKY / BACKGROUND LAYER                   -->
      <!-- ============================================ -->
      <div class="sky-layer" aria-hidden="true"></div>

      <!-- ============================================ -->
      <!-- 2. HEADER                                    -->
      <!-- ============================================ -->
      <div class="top-ui" aria-hidden="true">
        <h1>Wishing Well</h1>
        <p class="tagline">Whisper your wish, watch it float</p>
      </div>

      <!-- ============================================ -->
      <!-- 3. DIORAMA SCENE (back → front)             -->
      <!-- ============================================ -->
      <section class="diorama" aria-label="Isometric pixel art wishing well diorama">

        <!-- Well canvas — hero sprite: rim, shaft, water, coins -->
        <canvas
          id="wellCanvas"
          class="well-canvas"
          role="img"
          aria-label="Pixel art wishing well with visible stone rim, interior shaft, and shimmering water"
        ></canvas>

        <!-- Water/boat overlay — click detection for floating boats -->
        <canvas
          id="waterCanvas"
          class="overlay-canvas overlay-water"
          tabindex="0"
          aria-label="Floating origami boats on the water. Click a boat to discover a wish."
        ></canvas>

        <!-- Dust particles — floating in the shaft -->
        <canvas
          id="dustCanvas"
          class="overlay-canvas overlay-dust"
          aria-hidden="true"
        ></canvas>

        <!-- Sparkle particles — magic burst on wish cast -->
        <canvas
          id="sparkleCanvas"
          class="overlay-canvas overlay-sparkle"
          aria-hidden="true"
        ></canvas>

        <!-- Foreground props — CSS pixel art -->
        <div class="foreground-props" aria-hidden="true">
          <div class="prop prop-lantern"></div>
          <div class="prop prop-grass prop-grass-1"></div>
          <div class="prop prop-grass prop-grass-2"></div>
          <div class="prop prop-grass prop-grass-3"></div>
          <div class="prop prop-sign"></div>
        </div>
      </section>

      <!-- ============================================ -->
      <!-- 3. FLOATING UI                               -->
      <!-- ============================================ -->

      <!-- Coin toss animation container -->
      <div class="toss-container" id="tossContainer" aria-hidden="true">
        <div class="toss-coin" id="tossCoin"></div>
        <div class="toss-ripple" id="tossRipple"></div>
      </div>

      <!-- Toast notification -->
      <div class="toast" id="wishToast" role="status" aria-live="polite">
        <span class="toast-text">Your wish has been tossed!</span>
      </div>

      <!-- FAB — make a wish trigger -->
      <button
        class="wish-fab"
        id="openWishModal"
        type="button"
        aria-haspopup="dialog"
        aria-controls="wishModal"
      >
        Make a Wish
      </button>
    </main>

    <!-- ============================================ -->
    <!-- 4. MODALS (RPG dialog boxes)                -->
    <!-- ============================================ -->

    <!-- Wish input dialog -->
    <div class="modal-backdrop" id="wishModal" hidden>
      <section
        class="rpg-dialog modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="wishModalTitle"
      >
        <button
          class="dialog-close modal-close"
          id="closeWishModal"
          type="button"
          aria-label="Close wish dialog"
        >X</button>
        <h2 id="wishModalTitle" class="dialog-title">Write Your Wish</h2>
        <form id="wishForm" class="dialog-body">
          <label for="wishText" class="visually-hidden">Wish text</label>
          <textarea
            id="wishText"
            class="dialog-input"
            maxlength="200"
            placeholder="Whisper your wish..."
            required
          ></textarea>
          <div class="dialog-footer">
            <span id="wishCount" class="char-count" aria-live="polite">0 / 200</span>
            <button class="btn-pixel btn-primary" type="submit">Toss Coin</button>
          </div>
        </form>
      </section>
    </div>

    <!-- Wish discovery dialog -->
    <div class="modal-backdrop" id="discoverModal" hidden>
      <section
        class="rpg-dialog rpg-dialog--discover modal modal-discover"
        role="dialog"
        aria-modal="true"
        aria-labelledby="discoverTitle"
      >
        <button
          class="dialog-close modal-close"
          id="closeDiscoverModal"
          type="button"
          aria-label="Close wish discovery"
        >X</button>
        <h2 id="discoverTitle" class="dialog-title">A Wish from the Well</h2>
        <p id="discoverContent" class="dialog-body dialog-wish-text">Tap a boat to discover a wish.</p>
      </section>
    </div>

    <!-- Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="./js/firebase.js"></script>
    <script type="module" src="./js/scroll.js"></script>
    <script type="module" src="./js/canvas.js"></script>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
